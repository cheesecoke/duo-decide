name: CI

on:
 push:
  branches: [main, feat/redesign-v2]
 pull_request:
  branches: [main, feat/redesign-v2]

jobs:
 lint-and-format:
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v4

   - name: Setup Node.js
     uses: actions/setup-node@v4
     with:
      node-version: "20"
      cache: "npm"

   - name: Install dependencies
     run: npm ci

   - name: Run ESLint
     run: npm run lint

   - name: Check Prettier formatting
     run: npx prettier --check .

 test:
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v4

   - name: Setup Node.js
     uses: actions/setup-node@v4
     with:
      node-version: "20"
      cache: "npm"

   - name: Install dependencies
     run: npm ci

   - name: Run Jest
     run: npm test -- --ci

   - name: Run SQL tests (migrations on PGlite)
     run: npm run test:sql

 typecheck:
  runs-on: ubuntu-latest

  steps:
   - uses: actions/checkout@v4

   - name: Setup Node.js
     uses: actions/setup-node@v4
     with:
      node-version: "20"
      cache: "npm"

   - name: Install dependencies
     run: npm ci

   - name: Run TypeScript
     run: npm run typecheck
